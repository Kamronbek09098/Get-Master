<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#155DFC" />
    <meta
      name="description"
      content="GetMaster — muammoingizni tasvirlab bering, mos ustani toping, buyurtmani boshidan oxirigacha kuzating."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('getmaster.theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          var size = localStorage.getItem('getmaster.ui-size');
          document.documentElement.setAttribute('data-ui-size', size === 'small' || size === 'large' ? size : 'medium');
          // Ochilish animatsiyasi seansda bir marta ko‘rsatiladi (sahifa yangilanganda qayta chiqmaydi).
          if (sessionStorage.getItem('getmaster.splash')) document.documentElement.setAttribute('data-splash', 'off');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      #gm-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #1d3fae 0%, #0b1a4d 55%, #060d2b 100%);
        color: #fff;
        overflow: hidden;
        transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
      }
      html[data-splash='off'] #gm-splash { display: none; }
      #gm-splash.is-hiding { opacity: 0; transform: scale(1.04); visibility: hidden; }
      #gm-splash .gm-sp__glow {
        position: absolute; width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,176,32,0.28), rgba(21,93,252,0) 65%);
        animation: gm-sp-breathe 3.2s ease-in-out infinite;
      }
      #gm-splash .gm-sp__inner { position: relative; display: grid; justify-items: center; gap: 22px; padding: 24px; text-align: center; }
      #gm-splash .gm-sp__mark {
        position: relative; display: grid; place-items: center; width: 92px; height: 92px; border-radius: 28px;
        background: linear-gradient(135deg, #2f6bff, #155dfc 55%, #0c3bb8);
        box-shadow: 0 18px 40px -12px rgba(21,93,252,0.9), inset 0 1px 0 rgba(255,255,255,0.35);
        animation: gm-sp-pop 0.9s cubic-bezier(.2,1.3,.4,1) both;
      }
      #gm-splash .gm-sp__mark::after {
        content: ''; position: absolute; inset: -10px; border-radius: 36px; border: 2px solid rgba(255,176,32,0.65);
        animation: gm-sp-ring 1.8s ease-out 0.5s infinite;
      }
      #gm-splash .gm-sp__mark svg { width: 46px; height: 46px; animation: gm-sp-wrench 1.6s cubic-bezier(.5,0,.2,1) 0.35s both; transform-origin: 50% 50%; }
      #gm-splash .gm-sp__word { display: flex; font: 800 40px/1 Manrope, Inter, system-ui, sans-serif; letter-spacing: -0.03em; }
      #gm-splash .gm-sp__word span { display: inline-block; opacity: 0; transform: translateY(18px); animation: gm-sp-letter 0.55s cubic-bezier(.2,.9,.3,1) forwards; animation-delay: calc(0.45s + var(--i) * 0.06s); }
      #gm-splash .gm-sp__word .m { color: #ffb020; }
      #gm-splash .gm-sp__tag { margin: 0; font: 500 15px/1.4 Inter, system-ui, sans-serif; color: rgba(255,255,255,0.72); opacity: 0; animation: gm-sp-fade 0.7s ease 1.15s forwards; }
      #gm-splash .gm-sp__bar { width: 150px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.14); overflow: hidden; opacity: 0; animation: gm-sp-fade 0.4s ease 0.9s forwards; }
      #gm-splash .gm-sp__bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #ffb020, #fff2cf); animation: gm-sp-slide 1.1s ease-in-out infinite; }
      @keyframes gm-sp-pop { 0% { opacity: 0; transform: scale(.4) rotate(-18deg); } 100% { opacity: 1; transform: scale(1) rotate(-6deg); } }
      @keyframes gm-sp-wrench { 0% { transform: rotate(-70deg) scale(.6); } 60% { transform: rotate(18deg) scale(1.08); } 100% { transform: rotate(0) scale(1); } }
      @keyframes gm-sp-ring { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.35); } }
      @keyframes gm-sp-letter { to { opacity: 1; transform: translateY(0); } }
      @keyframes gm-sp-fade { to { opacity: 1; } }
      @keyframes gm-sp-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(380%); } }
      @keyframes gm-sp-breathe { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #gm-splash *, #gm-splash *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        #gm-splash .gm-sp__word span, #gm-splash .gm-sp__tag, #gm-splash .gm-sp__bar { opacity: 1; transform: none; }
      }
    </style>
    <title>GetMaster</title>
  </head>
  <body>
    <div id="gm-splash" role="status" aria-label="GetMaster">
      <div class="gm-sp__glow"></div>
      <div class="gm-sp__inner">
        <div class="gm-sp__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <div class="gm-sp__word" aria-hidden="true"><span style="--i:0">G</span><span style="--i:1">e</span><span style="--i:2">t</span><span style="--i:3" class="m">M</span><span style="--i:4" class="m">a</span><span style="--i:5" class="m">s</span><span style="--i:6" class="m">t</span><span style="--i:7" class="m">e</span><span style="--i:8" class="m">r</span></div>
        <p class="gm-sp__tag">Muammoni ayting — mos ustani biz topamiz</p>
        <div class="gm-sp__bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
