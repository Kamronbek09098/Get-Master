<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#155DFC" />
    <meta
      name="description"
      content="GetMaster — muammoingizni tasvirlab bering, mos ustani toping, buyurtmani boshidan oxirigacha kuzating."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('getmaster.theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          var size = localStorage.getItem('getmaster.ui-size');
          document.documentElement.setAttribute('data-ui-size', size === 'small' || size === 'large' ? size : 'medium');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>GetMaster</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
